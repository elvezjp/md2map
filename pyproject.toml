[project]
name = "md2map"
version = "0.5.0"
description = "マークダウンファイルを意味的単位に分割し、AI解析用の索引を生成するCLIツール"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Elvez Inc.", email = "info@elvez.co.jp" }
]
keywords = ["markdown", "documentation", "ai", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # `[tool.uv.sources]` は非推移的で、md2map を依存として取り込む側には届かない。
    # バージョン制約は推移的に効くため、依存元が別のソース定義で古い版を解決した場合に
    # ここで検出できる。
    "add-line-numbers>=0.1.3",
]

[tool.uv.sources]
# NOTE: このリポジトリで uv を使う場合、`add-line-numbers` は公開リポジトリから取得する。
# `[project.dependencies]` 側にも残し、実行時依存として明示する。
# branch 参照は指し先が動くため、参照先が差し替わっても気づけない（CWE-829）。
# タグを参照し、更新は pyproject.toml の差分としてレビュー対象にする。
add-line-numbers = { git = "https://github.com/elvezjp/add-line-numbers.git", tag = "v0.1.3" }

[project.urls]
Homepage = "https://github.com/elvezjp/md2map"
Repository = "https://github.com/elvezjp/md2map"
Issues = "https://github.com/elvezjp/md2map/issues"
Changelog = "https://github.com/elvezjp/md2map/blob/main/CHANGELOG.md"

[project.optional-dependencies]
nlp = [
    "sudachipy>=0.6",
    "sudachidict-core>=20230927",
]
ai = [
    "openai>=1.0",
    "anthropic>=0.18",
    "boto3>=1.28",
    "python-dotenv>=1.0",
]
dev = [
    "md2map[nlp,ai]",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
md2map = "md2map.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["md2map"]

[tool.hatch.build.targets.sdist]
include = [
    "/md2map",
    "/README.md",
    "/README_ja.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CHANGELOG_ja.md",
    "/pyproject.toml",
]
exclude = [
    "/docs",
    "/tests",
    "/main.py",
    "/spec.md",
    "/.env.example",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
